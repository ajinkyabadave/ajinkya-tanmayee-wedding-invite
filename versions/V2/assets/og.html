<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: "Cormorant Garamond", serif;
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(180,18,122,0.12), transparent 55%),
        radial-gradient(120% 90% at 100% 100%, rgba(201,154,59,0.16), transparent 55%),
        #FCF6EE;
      color: #4a2036;
      display: flex; align-items: center; gap: 48px;
      padding: 56px 70px;
      border: 3px solid #C99A3B;
      box-shadow: inset 0 0 0 8px #FCF6EE, inset 0 0 0 10px rgba(201,154,59,0.4);
    }
    .logo { width: 400px; height: 400px; flex: none; }
    .logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(107,21,72,0.2)); }
    .txt { flex: 1; }
    .mantra { color: #9C6E1E; letter-spacing: 0.22em; text-transform: uppercase;
      font-family: "Playfair Display", serif; font-size: 20px; }
    .mantra span { color: #B4127A; }
    .names { font-family: "Playfair Display", serif; font-weight: 700; line-height: 1.02;
      font-size: 92px; margin: 14px 0 6px;
      background: linear-gradient(180deg,#E6C36B,#C99A3B 55%,#9C6E1E);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .weds { font-style: italic; color: #B4127A; font-size: 40px; margin: 2px 0; }
    .rule { width: 120px; height: 2px; background: linear-gradient(90deg,#C99A3B,transparent); margin: 18px 0; }
    .when { font-size: 34px; color: #6B1548; font-weight: 500; }
    .when b { color: #8E0C60; }
    .venue { font-size: 26px; color: #4a2036; opacity: 0.85; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="logo"><img src="logo.jpg" alt="" /></div>
  <div class="txt">
    <div class="mantra"><span>॥</span> Shree Ganeshaya Namah <span>॥</span></div>
    <div class="names">Ajinkya <span class="weds" style="display:inline-block;font-size:44px;-webkit-text-fill-color:#B4127A;">weds</span> Tanmayee</div>
    <div class="rule"></div>
    <div class="when" id="line1">Wedding · Saturday, 5 September 2026</div>
    <div class="when" id="line2">Muhurta at <b>12:33 PM</b></div>
    <div class="venue">Amanora The Fern · Amanora Park Town, Hadapsar, Pune</div>
  </div>
  <script>
    // ?v=full switches the date lines to the two-day version.
    if (new URLSearchParams(location.search).get('v') === 'full') {
      document.getElementById('line1').textContent = '4 Sep · Seemant Poojan & Sangeet';
      document.getElementById('line2').innerHTML = '5 Sep · Wedding, muhurta at <b>12:33 PM</b>';
    }
  </script>
</body>
</html>
